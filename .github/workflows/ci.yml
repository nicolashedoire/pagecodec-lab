name: Correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-arm-boot:
    name: Rust ARM boot / QEMU VM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ARM target and virtual machine
        run: |
          rustup target add aarch64-unknown-none-softfloat
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm
      - name: Build and boot Rust kernel in QEMU
        working-directory: experiments/arm_boot
        run: |
          cargo build --release --locked --offline
          python3 run_vm.py
      - name: Build and check VirtIO driver in QEMU
        working-directory: experiments/virtio_rng
        run: |
          cargo build --release --locked
          python3 run_vm.py --qemu qemu-system-aarch64
      - name: Build and check dual input router in QEMU
        working-directory: experiments/dual_input
        run: |
          cargo build --release --locked --offline
          python3 run_vm.py --qemu qemu-system-aarch64
      - name: Build and exercise graphical guest and MCP pointer in QEMU
        run: |
          (cd experiments/dual_pointer_display && cargo build --release --locked)
          (cd experiments/vm_mcp_client && cargo build --release --locked)
          python3 experiments/dual_pointer_display/run_demo.py \
            --qemu qemu-system-aarch64 \
            --guest "$PWD/experiments/dual_pointer_display/target/aarch64-unknown-none-softfloat/release/dual-pointer-display" \
            --client "$PWD/experiments/vm_mcp_client/target/release/vm-mcp-client" \
            --output-dir "$RUNNER_TEMP/dual-pointer-evidence" \
            --startup-wait 5
      - name: Preserve dual-pointer VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dual-pointer-vm-evidence
          path: ${{ runner.temp }}/dual-pointer-evidence/
          if-no-files-found: ignore
      - name: Build and check synthetic VirtIO block guest in QEMU
        working-directory: experiments/virtio_block
        run: |
          cargo build --release --locked
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/virtio-block-lab \
            --output-dir "$RUNNER_TEMP/virtio-block-evidence"
      - name: Preserve block VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtio-block-vm-evidence
          path: ${{ runner.temp }}/virtio-block-evidence/
          if-no-files-found: ignore
      - name: Build and check extensible actor registry in QEMU
        working-directory: experiments/actor_core
        run: |
          cargo build --release --locked --features qemu-demo
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/actor-core-demo \
            --output-dir "$RUNNER_TEMP/actor-core-evidence"
      - name: Preserve actor VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actor-core-vm-evidence
          path: ${{ runner.temp }}/actor-core-evidence/
          if-no-files-found: ignore
      - name: Build and check workspace bridge in QEMU
        working-directory: experiments/workspace_bridge
        run: |
          cargo build --release --locked --features qemu-demo
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/workspace-bridge-demo \
            --output-dir "$RUNNER_TEMP/workspace-bridge-evidence"
      - name: Preserve workspace VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-bridge-vm-evidence
          path: ${{ runner.temp }}/workspace-bridge-evidence/
          if-no-files-found: ignore
      - name: Build and check synthetic frame allocator in QEMU
        working-directory: experiments/memory_core
        run: |
          cargo build --release --locked --offline --features qemu-demo
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/memory-core-demo \
            --output-dir "$RUNNER_TEMP/memory-core-evidence"
      - name: Preserve memory VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-core-vm-evidence
          path: ${{ runner.temp }}/memory-core-evidence/
          if-no-files-found: ignore
      - name: Build and check guest frame arena in QEMU
        working-directory: experiments/memory_arena
        run: |
          cargo build --release --locked --offline
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/memory-arena-demo \
            --output-dir "$RUNNER_TEMP/memory-arena-evidence"
      - name: Preserve arena VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-arena-vm-evidence
          path: ${{ runner.temp }}/memory-arena-evidence/
          if-no-files-found: ignore
      - name: Build and check VirtIO feature negotiation in QEMU
        working-directory: experiments/virtio_negotiation
        run: |
          cargo build --release --locked
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/virtio-negotiation-lab \
            --output-dir "$RUNNER_TEMP/virtio-negotiation-evidence"
      - name: Preserve negotiation VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtio-negotiation-vm-evidence
          path: ${{ runner.temp }}/virtio-negotiation-evidence/
          if-no-files-found: ignore
      - name: Build and check workspace persistence in QEMU
        working-directory: experiments/workspace_persistence
        run: |
          cargo build --release --locked --offline
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/workspace-persistence-demo \
            --output-dir "$RUNNER_TEMP/workspace-persistence-evidence"
      - name: Preserve persistence VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-persistence-vm-evidence
          path: ${{ runner.temp }}/workspace-persistence-evidence/
          if-no-files-found: ignore
      - name: Build and check dynamic pointer routing in QEMU
        working-directory: experiments/dynamic_input
        run: |
          cargo build --release --locked --offline --features qemu-demo
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/dynamic-input-demo \
            --output-dir "$RUNNER_TEMP/dynamic-input-evidence"
      - name: Preserve dynamic pointer VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dynamic-input-vm-evidence
          path: ${{ runner.temp }}/dynamic-input-evidence/
          if-no-files-found: ignore
      - name: Build and check local VirtIO patch in QEMU
        working-directory: experiments/virtio_fix
        run: |
          cargo build --release --locked
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/virtio-fix-lab \
            --output-dir "$RUNNER_TEMP/virtio-fix-evidence"
      - name: Preserve local VirtIO patch VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtio-fix-vm-evidence
          path: ${{ runner.temp }}/virtio-fix-evidence/
          if-no-files-found: ignore
      - name: Build and check scheduler model in QEMU
        working-directory: experiments/scheduler_core
        run: |
          cargo build --release --locked --offline --features qemu-demo
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/scheduler-core-demo \
            --output-dir "$RUNNER_TEMP/scheduler-core-evidence"
      - name: Preserve scheduler VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduler-core-vm-evidence
          path: ${{ runner.temp }}/scheduler-core-evidence/
          if-no-files-found: ignore
      - name: Build and check controlled ARM exception in QEMU
        working-directory: experiments/interrupt_core
        run: |
          cargo build --release --locked --offline
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/interrupt-core-demo \
            --output-dir "$RUNNER_TEMP/interrupt-core-evidence"
      - name: Preserve exception VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interrupt-core-vm-evidence
          path: ${{ runner.temp }}/interrupt-core-evidence/
          if-no-files-found: ignore
      - name: Build and check virtual ARM timer in QEMU
        working-directory: experiments/arm_timer
        run: |
          cargo build --release --locked --offline
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/arm-timer-demo \
            --output-dir "$RUNNER_TEMP/arm-timer-evidence"
      - name: Preserve timer VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arm-timer-vm-evidence
          path: ${{ runner.temp }}/arm-timer-evidence/
          if-no-files-found: ignore
      - name: Build and check cooperative context switching in QEMU
        working-directory: experiments/cooperative_tasks
        run: |
          cargo build --release --locked --offline
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/cooperative-tasks-demo \
            --output-dir "$RUNNER_TEMP/cooperative-tasks-evidence"
      - name: Preserve cooperative tasks VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cooperative-tasks-vm-evidence
          path: ${{ runner.temp }}/cooperative-tasks-evidence/
          if-no-files-found: ignore

  rust-workspaces:
    name: Rust workspace core / Ubuntu VM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test two-workspace merge
        working-directory: experiments/system_core
        run: cargo test --locked --offline
      - name: Test AI pointer adapter
        working-directory: experiments/agent_pointer
        run: cargo test --locked --offline

  portable-codec:
    name: Portable codec / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run codec tests
        run: make test CC=clang
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make sanitize CC=clang
      - name: Check operation-level experiments
        run: make test-operations sanitize-operations CC=clang CXX=clang++
      - name: Check complete report application
        run: make test-end-to-end sanitize-end-to-end CXX=clang++
      - name: Check native minor compaction
        run: make test-compaction sanitize-compaction CXX=clang++
      - name: Check adaptive compaction
        run: |
          mkdir -p build
          clang++ -O3 -std=c++17 -Wall -Wextra -Werror experiments/compaction_adaptive/compaction_bench.cpp -o build/adaptive-compaction
          python3 tests/test_compaction_adaptive.py --binary "$PWD/build/adaptive-compaction"
          clang++ -O1 -g -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer experiments/compaction_adaptive/compaction_bench.cpp -o build/adaptive-compaction-sanitize
          python3 tests/test_compaction_adaptive.py --binary "$PWD/build/adaptive-compaction-sanitize"

  macos-comparator:
    name: Apple codec comparator / macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run codec tests and sanitizers
        run: make test sanitize CC=clang
      - name: Build comparator and check tiny fixtures
        run: make smoke CC=clang
      - name: Check operation-level experiments
        run: make test-operations sanitize-operations CC=clang CXX=clang++
      - name: Check complete report application
        run: make test-end-to-end sanitize-end-to-end CXX=clang++
      - name: Check native minor compaction
        run: make test-compaction sanitize-compaction CXX=clang++
      - name: Check adaptive compaction
        run: |
          mkdir -p build
          clang++ -O3 -std=c++17 -Wall -Wextra -Werror experiments/compaction_adaptive/compaction_bench.cpp -o build/adaptive-compaction
          python3 tests/test_compaction_adaptive.py --binary "$PWD/build/adaptive-compaction"
          clang++ -O1 -g -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer experiments/compaction_adaptive/compaction_bench.cpp -o build/adaptive-compaction-sanitize
          python3 tests/test_compaction_adaptive.py --binary "$PWD/build/adaptive-compaction-sanitize"
      # Shared CI runners validate correctness only. Their timings are not
      # used as benchmark results or evidence of performance superiority.
