name: Correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-arm-boot:
    name: Rust ARM boot / QEMU VM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ARM target and virtual machine
        run: |
          rustup target add aarch64-unknown-none-softfloat
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm
      - name: Build and boot Rust kernel in QEMU
        working-directory: experiments/arm_boot
        run: |
          cargo build --release --locked --offline
          python3 run_vm.py
      - name: Build and check VirtIO driver in QEMU
        working-directory: experiments/virtio_rng
        run: |
          cargo build --release --locked
          python3 run_vm.py --qemu qemu-system-aarch64
      - name: Build and check dual input router in QEMU
        working-directory: experiments/dual_input
        run: |
          cargo build --release --locked --offline
          python3 run_vm.py --qemu qemu-system-aarch64

  rust-workspaces:
    name: Rust workspace core / Ubuntu VM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test two-workspace merge
        working-directory: experiments/system_core
        run: cargo test --locked --offline
      - name: Test AI pointer adapter
        working-directory: experiments/agent_pointer
        run: cargo test --locked --offline

  portable-codec:
    name: Portable codec / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run codec tests
        run: make test CC=clang
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make sanitize CC=clang
      - name: Check operation-level experiments
        run: make test-operations sanitize-operations CC=clang CXX=clang++
      - name: Check complete report application
        run: make test-end-to-end sanitize-end-to-end CXX=clang++
      - name: Check native minor compaction
        run: make test-compaction sanitize-compaction CXX=clang++
      - name: Check adaptive compaction
        run: |
          mkdir -p build
          clang++ -O3 -std=c++17 -Wall -Wextra -Werror experiments/compaction_adaptive/compaction_bench.cpp -o build/adaptive-compaction
          python3 tests/test_compaction_adaptive.py --binary "$PWD/build/adaptive-compaction"
          clang++ -O1 -g -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer experiments/compaction_adaptive/compaction_bench.cpp -o build/adaptive-compaction-sanitize
          python3 tests/test_compaction_adaptive.py --binary "$PWD/build/adaptive-compaction-sanitize"

  macos-comparator:
    name: Apple codec comparator / macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run codec tests and sanitizers
        run: make test sanitize CC=clang
      - name: Build comparator and check tiny fixtures
        run: make smoke CC=clang
      - name: Check operation-level experiments
        run: make test-operations sanitize-operations CC=clang CXX=clang++
      - name: Check complete report application
        run: make test-end-to-end sanitize-end-to-end CXX=clang++
      - name: Check native minor compaction
        run: make test-compaction sanitize-compaction CXX=clang++
      - name: Check adaptive compaction
        run: |
          mkdir -p build
          clang++ -O3 -std=c++17 -Wall -Wextra -Werror experiments/compaction_adaptive/compaction_bench.cpp -o build/adaptive-compaction
          python3 tests/test_compaction_adaptive.py --binary "$PWD/build/adaptive-compaction"
          clang++ -O1 -g -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer experiments/compaction_adaptive/compaction_bench.cpp -o build/adaptive-compaction-sanitize
          python3 tests/test_compaction_adaptive.py --binary "$PWD/build/adaptive-compaction-sanitize"
      # Shared CI runners validate correctness only. Their timings are not
      # used as benchmark results or evidence of performance superiority.
