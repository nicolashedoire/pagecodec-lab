name: Correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-arm-boot:
    name: Rust ARM boot / QEMU VM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ARM target and virtual machine
        run: |
          rustup target add aarch64-unknown-none-softfloat
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm
      - name: Build and boot Rust kernel in QEMU
        working-directory: experiments/arm_boot
        run: |
          cargo build --release --locked --offline
          python3 run_vm.py
      - name: Build and check VirtIO driver in QEMU
        working-directory: experiments/virtio_rng
        run: |
          cargo build --release --locked
          python3 run_vm.py --qemu qemu-system-aarch64
      - name: Build and check dual input router in QEMU
        working-directory: experiments/dual_input
        run: |
          cargo build --release --locked --offline
          python3 run_vm.py --qemu qemu-system-aarch64
      - name: Build and exercise graphical guest and MCP pointer in QEMU
        run: |
          (cd experiments/dual_pointer_display && cargo build --release --locked)
          (cd experiments/vm_mcp_client && cargo build --release --locked)
          python3 experiments/dual_pointer_display/run_demo.py \
            --qemu qemu-system-aarch64 \
            --guest "$PWD/experiments/dual_pointer_display/target/aarch64-unknown-none-softfloat/release/dual-pointer-display" \
            --client "$PWD/experiments/vm_mcp_client/target/release/vm-mcp-client" \
            --output-dir "$RUNNER_TEMP/dual-pointer-evidence" \
            --startup-wait 5
      - name: Preserve dual-pointer VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dual-pointer-vm-evidence
          path: ${{ runner.temp }}/dual-pointer-evidence/
          if-no-files-found: ignore
      - name: Build and check synthetic VirtIO block guest in QEMU
        working-directory: experiments/virtio_block
        run: |
          cargo build --release --locked
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/virtio-block-lab \
            --output-dir "$RUNNER_TEMP/virtio-block-evidence"
      - name: Preserve block VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtio-block-vm-evidence
          path: ${{ runner.temp }}/virtio-block-evidence/
          if-no-files-found: ignore
      - name: Build and check extensible actor registry in QEMU
        working-directory: experiments/actor_core
        run: |
          cargo build --release --locked --features qemu-demo
          python3 run_demo.py --qemu qemu-system-aarch64 \
            --guest target/aarch64-unknown-none-softfloat/release/actor-core-demo \
            --output-dir "$RUNNER_TEMP/actor-core-evidence"
      - name: Preserve actor VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actor-core-vm-evidence
          path: ${{ runner.temp }}/actor-core-evidence/
          if-no-files-found: ignore
      - name: Build and check workspace bridge in QEMU
        working-directory: experiments/workspace_bridge
