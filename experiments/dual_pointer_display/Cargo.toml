[package]
name = "dual-pointer-display"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
virtio-drivers = { version = "=0.13.0", default-features = false, features = ["alloc"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
lto = true
