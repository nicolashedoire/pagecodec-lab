[package]
name = "system-vm-demo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dynamic-input-sketch = { path = "../dynamic_input" }
actor-core-sketch = { path = "../actor_core" }
system-core-sketch = { path = "../system_core" }
workspace-bridge-sketch = { path = "../workspace_bridge" }
virtio-drivers = { path = "../virtio_fix/vendor/virtio-drivers", version = "=0.13.0", default-features = false, features = ["alloc"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
lto = true
